<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>Survey - The Canapa</title>

    <style>
        body, button, select, option, input{
            font-family:Georgia,'Times New Roman',serif;
        }
        .ratio {
            margin-bottom: 1rem;
        }
        select, button, input.input-area {
            width: 100%;
            font-size: large;
            margin-bottom: 1.2rem;
            padding: 1rem;
        }
        span.ratio-content {
            font-size: large;
        }
        button {
            font-size: x-large;
            font-weight: 900;
        }
    </style>

</head>
<body>

    <header>
        <div class="logo">The Canapa</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">News</a>
            <a href="#">Technology</a>
            <a href="#">Society</a>
        </nav>
    </header>
    <main>
        <div class="main">
            <div class="contenuto">
                <h1>Survey - Strait of Messina Bridge Moves Forward with New Roundabout Plan</h1><br>
                <div class="subtitle">
                    <a href="index.html" style="text-decoration: none; color: #666;">&lt;&lt; Return to the article</a>
                </div>
                <p class="note" style="margin-top: 1px;"></p>

                <article>
                    <div class="form-group">
                        <label><h2>How old are you?</h3></label>
                        <div class="input">
                            <input class="input-area" type="number">
                        </div>
                    </div>
                    <div class="form-group">
                        <label><h2>Which region do you live in?</h3></label>
                        <div class="input">
                            <select>
                                <option>Insert your region</option>
                                <option>Abruzzo</option>
                                <option>Basilicata</option>
                                <option>Calabria</option>
                                <option>Campania</option>
                                <option>Emilia-Romagna</option>
                                <option>Friuli-Venezia Giulia</option>
                                <option>Lazio</option>
                                <option>Liguria</option>
                                <option>Lombardia</option>
                                <option>Marche</option>
                                <option>Molise</option>
                                <option>Piemonte</option>
                                <option>Puglia</option>
                                <option>Sardegna</option>
                                <option>Sicilia</option>
                                <option>Toscana</option>
                                <option>Trentino-Alto Adige</option>
                                <option>Umbria</option>
                                <option>Valle d'Aosta</option>
                                <option>Veneto</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label><h3>Do you agree on the new roundabout project?</h3></label>
                        <div class="ratio">
                            <label class="radio-item">
                                <input type="radio" name="continue" value="yes"/>
                                <span class="ratio-content">Yes</span>
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="continue" value="no"/>
                                <span class="ratio-content">No</span>
                            </label>
                        </div>
                    </div>
                    <div class="pulsanti">
                        <a href="index.html"><button class="button">Submit</button></a>
                    </div>
                </article>

            </div>
        </div>
    </main>
    <footer>
        © 2026 The Canapa Team
    </footer>
</body>
</html>
